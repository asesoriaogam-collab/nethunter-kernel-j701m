name: Build NetHunter Kernel J701M (3.18.140 r28p0 Permissive)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Checkout repositorio local
        uses: actions/checkout@v4

      - name: 2. Instalar dependencias de compilacion
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 python-is-python3

      - name: 3. Clonar Toolchain GCC 4.9 y Kernel XDA (simple_q_permissive)
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain
          git clone --depth=1 https://github.com/samsungexynos7870/android_kernel_samsung_exynos7870.git -b simple_q_permissive kernel_source
          git clone --depth=1 https://github.com/aircrack-ng/rtl8188eus.git -b v5.3.9 drivers_8188eu

      - name: 4. Integrar RTL8188EUS, Parches de Compilacion y Forzar SELinux Permissive
        run: |
          cd kernel_source
          mkdir -p out

          # Integrar driver RTL8188EUS
          cp -rf ../drivers_8188eu drivers/net/wireless/rtl8188eus
          sed -i 's/EXTRA_CFLAGS += -Wno-error=date-time/#EXTRA_CFLAGS += -Wno-error=date-time/g' drivers/net/wireless/rtl8188eus/Makefile || true
          echo 'obj-$(CONFIG_RTL8188EU) += rtl8188eus/' >> drivers/net/wireless/Makefile

          # Copiar defconfig base
          cp -f ../j7velte_nethunter_defconfig out/.config

          # Parchear SELinux directamente en el codigo fuente para garantizar permissive=1 (enforcing=0)
          sed -i 's/selinux_enforcing = 1/selinux_enforcing = 0/g' security/selinux/*.c security/selinux/include/*.h 2>/dev/null || true
          sed -i 's/enforcing = 1/enforcing = 0/g' security/selinux/hooks.c 2>/dev/null || true
          sed -i 's/CONFIG_SECURITY_SELINUX_ALWAYS_ENFORCE/CONFIG_DISABLED_ALWAYS_ENFORCE/g' security/selinux/*.c security/selinux/include/*.h 2>/dev/null || true

          # Definir constantes de estado del panel sin alterar lcd->code original
          sed -i '1i #ifndef PANEL_STATE_RESUMED\n#define PANEL_STATE_RESUMED 0\n#define PANEL_STATE_SUSPENED 1\n#define PANEL_STATE_SUSPENDING 2\n#endif' drivers/video/fbdev/exynos/decon_7870/panels/ea8061s_j7lite_lcd_ctrl.c || true

          # Ajustar flags en .config
          chmod -R +x scripts/
          ./scripts/config --file out/.config -e SECURITY_SELINUX_DEVELOP
          ./scripts/config --file out/.config -d SECURITY_SELINUX_ALWAYS_ENFORCE
          ./scripts/config --file out/.config -d ALWAYS_ENFORCE
          ./scripts/config --file out/.config -e SECURITY_SELINUX_ALWAYS_PERMISSIVE
          ./scripts/config --file out/.config -e DISPLAY_USE_INFO
          ./scripts/config --file out/.config -e MODULES
          ./scripts/config --file out/.config -e CFG80211
          ./scripts/config --file out/.config -e MAC80211
          ./scripts/config --file out/.config -e MAC80211_MESH
          ./scripts/config --file out/.config -e ATH9K_HTC
          ./scripts/config --file out/.config -e RT2800USB
          ./scripts/config --file out/.config -e RTL8187
          ./scripts/config --file out/.config -e RTL8192CU

      - name: 5. Compilar Kernel (arm64)
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          cd kernel_source
          make O=out olddefconfig
          sed -i 's/CONFIG_SECURITY_SELINUX_ALWAYS_ENFORCE=y/# CONFIG_SECURITY_SELINUX_ALWAYS_ENFORCE is not set/g' out/.config || true
          make O=out -j$(nproc --all) KCFLAGS="-Wno-error -fno-pic"

      - name: 6. Empaquetar Image
        run: |
          cp kernel_source/out/arch/arm64/boot/Image ./Image
          zip -r9 NetHunter-J701M-Kernel-Clean.zip Image

      - name: 7. Subir Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-J701M-Kernel-Clean
          path: NetHunter-J701M-Kernel-Clean.zip
