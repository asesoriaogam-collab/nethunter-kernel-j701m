name: Build NetHunter J701M Final Permissive

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Checkout repositorio local
        uses: actions/checkout@v4

      - name: 2. Instalar dependencias de compilacion
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 python-is-python3

      - name: 3. Clonar Toolchain GCC 4.9 y Kernel gonicdroid (3.18.140)
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain
          git clone --depth=1 https://github.com/gonicdroid/android_kernel_samsung_exynos7870.git -b main kernel_source
          git clone --depth=1 https://github.com/aircrack-ng/rtl8188eus.git -b v5.3.9 drivers_8188eu

      - name: 4. Parchear Codigo Fuente (Drivers Wi-Fi, SELinux Permissive y Panel de Video)
        run: |
          cd kernel_source
          mkdir -p out

          # Integrar driver RTL8188EUS
          cp -rf ../drivers_8188eu drivers/net/wireless/rtl8188eus
          sed -i 's/EXTRA_CFLAGS += -Wno-error=date-time/#EXTRA_CFLAGS += -Wno-error=date-time/g' drivers/net/wireless/rtl8188eus/Makefile || true
          echo 'obj-$(CONFIG_RTL8188EU) += rtl8188eus/' >> drivers/net/wireless/Makefile

          # Copiar defconfig base
          cp -f ../j7velte_nethunter_defconfig out/.config

          # Forzar SELinux Permissive a nivel de codigo fuente en security/selinux
          find security/selinux -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/CONFIG_SECURITY_SELINUX_ALWAYS_ENFORCE/CONFIG_NO_ALWAYS_ENFORCE/g' {} +
          find security/selinux -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/selinux_enforcing = 1/selinux_enforcing = 0/g' {} +
          sed -i 's/enforcing = 1/enforcing = 0/g' security/selinux/hooks.c || true

          # Mantener valores reales de calibracion del panel AMOLED intactos (dsim_panel.h)
          sed -i '1i #ifndef PANEL_STATE_RESUMED\n#define PANEL_STATE_RESUMED 0\n#define PANEL_STATE_SUSPENED 1\n#define PANEL_STATE_SUSPENDING 2\n#endif' drivers/video/fbdev/exynos/decon_7870/panels/ea8061s_j7lite_lcd_ctrl.c || true
          sed -i 's/#ifdef CONFIG_DISPLAY_USE_INFO/#if 1/g' drivers/video/fbdev/exynos/decon_7870/panels/dsim_panel.h || true

          # Configurar .config con herramientas del kernel
          chmod -R +x scripts/
          ./scripts/config --file out/.config -d DISPLAY_USE_INFO
          ./scripts/config --file out/.config -e SECURITY_SELINUX_DEVELOP
          ./scripts/config --file out/.config -e SECURITY_SELINUX_ALWAYS_PERMISSIVE
          ./scripts/config --file out/.config -d SECURITY_SELINUX_ALWAYS_ENFORCE
          ./scripts/config --file out/.config -e MODULES
          ./scripts/config --file out/.config -e CFG80211
          ./scripts/config --file out/.config -e MAC80211
          ./scripts/config --file out/.config -e MAC80211_MESH
          ./scripts/config --file out/.config -e ATH9K_HTC
          ./scripts/config --file out/.config -e RT2800USB
          ./scripts/config --file out/.config -e RTL8187
          ./scripts/config --file out/.config -e RTL8192CU

      - name: 5. Compilar Kernel (arm64)
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          cd kernel_source
          make O=out olddefconfig
          sed -i 's/CONFIG_SECURITY_SELINUX_ALWAYS_ENFORCE=y/# CONFIG_SECURITY_SELINUX_ALWAYS_ENFORCE is not set/g' out/.config || true
          make O=out -j$(nproc --all) V=1 HOSTCFLAGS="-fcommon" KCFLAGS="-Wno-error -fno-pic"

      - name: 6. Empaquetar Image
        run: |
          cp kernel_source/out/arch/arm64/boot/Image ./Image
          zip -r9 NetHunter-J701M-Kernel-Final.zip Image

      - name: 7. Subir Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-J701M-Kernel-Final
          path: NetHunter-J701M-Kernel-Final.zip
