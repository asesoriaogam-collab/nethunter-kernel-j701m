name: Compilar Kernel NetHunter J701M Limpio

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar paquetes de compilacion
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses-dev lib32z1-dev liblz4-tool libncurses-dev libssl-dev libxml2-utils lzop rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: 3. Clonar SIMPLE-KERNEL Exynos 7870 y GCC 4.9
        run: |
          git clone --depth=1 https://github.com/Exynos7870/android_kernel_samsung_exynos7870.git kernel_source
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain

      - name: 4. Preparar codigo fuente (Sin tocar archivos de red)
        run: |
          cp j7velte_nethunter_defconfig kernel_source/arch/arm64/configs/j7velte_nh_defconfig
          cd kernel_source

          # 4.1 Parchear exclusivamente el bug de lcd->code y el header de pm_opp en GPU
          sed -i 's/lcd->code\[[0-9]\]/0/g' drivers/video/fbdev/exynos/decon_7870/panels/ea8061s_j7lite_lcd_ctrl.c || true
          find drivers/gpu/arm/t83x -name "mali_kbase_core_linux.c" -exec sed -i '1i #include <linux/pm_opp.h>\n__attribute__((weak)) int dev_pm_opp_of_add_table(struct device *dev) { return 0; }' {} + || true
          # Si el arbol tiene r28p0, forzar que el Makefile de t83x compile r28p0 en lugar de r12p0
          if [ -d "drivers/gpu/arm/t83x/r28p0" ]; then
            sed -i 's/r12p0/r28p0/g' drivers/gpu/arm/t83x/Makefile drivers/gpu/arm/t83x/Kconfig || true
          fi

          # 4.2 Proveer stubs debiles (weak) para Knox/NPA por si algun driver de Samsung no los enlaza
          cat << 'STUB_EOF' >> net/ipv4/af_inet.c

          /* Fallback weak symbols para evitar undefined reference al enlazar vmlinux */
          __attribute__((weak)) unsigned int check_ncm_flag(void) { return 0; }
          struct knox_socket_metadata;
          __attribute__((weak)) void insert_data_kfifo_kthread(struct knox_socket_metadata* k) { }
          STUB_EOF

          # 4.3 Ajustes de compilador GCC 4.9 y dtc en Ubuntu 22.04
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.l || true
          sed -i 's/-Werror-implicit-function-declaration/-Wno-implicit-function-declaration/g' Makefile || true
          sed -i 's/-Werror=implicit-function-declaration/-Wno-implicit-function-declaration/g' Makefile || true
          sed -i 's/-Wno-logical-not-parentheses//g' Makefile || true
          find drivers/video/fbdev/exynos -name "Makefile*" -exec sed -i 's/-Werror//g' {} + || true
          sed -i 's|source "net/wireguard/Kconfig"|# source "net/wireguard/Kconfig"|g' net/Kconfig || true
          sed -i '/wireguard/d' net/Makefile || true
          sed -i 's/echo "+"/#echo "+"/g' scripts/setlocalversion || true

          # 4.4 Habilitar inyeccion de paquetes en mac80211
          sed -i 's/IEEE80211_TX_CTL_REQ_TX_STATUS/IEEE80211_TX_CTL_REQ_TX_STATUS | IEEE80211_TX_CTL_INJECTED/g' net/mac80211/tx.c || true

      - name: 5. Compilar Kernel (arm64)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export ANDROID_MAJOR_VERSION=q
          export PLATFORM_VERSION=10.0.0
          export CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-android-
          cd kernel_source
          make O=out HOSTCFLAGS="-fcommon -Wno-error" j7velte_nh_defconfig
          echo "CONFIG_MALI_T83X=y" >> out/.config
          echo "CONFIG_MALI_R28P0=y" >> out/.config
          echo "# CONFIG_MALI_R12P0 is not set" >> out/.config
          echo "# CONFIG_MALI_R29P0 is not set" >> out/.config
          echo "CONFIG_PM_OPP=y" >> out/.config
          echo "# CONFIG_DISPLAY_USE_INFO is not set" >> out/.config
          make O=out HOSTCFLAGS="-fcommon -Wno-error" olddefconfig
          make O=out HOSTCFLAGS="-fcommon -Wno-error" KCFLAGS="-Wno-error -Wno-implicit-function-declaration" -j$(nproc --all)

      - name: 6. Subir binario Image y paquete AnyKernel3
        run: |
          cp kernel_source/out/arch/arm64/boot/Image ./Image
          zip -r9 NetHunter-J701M-Kernel-Clean.zip Image
        
      - name: 7. Publicar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-J701M-Clean-Image
          path: NetHunter-J701M-Kernel-Clean.zip
