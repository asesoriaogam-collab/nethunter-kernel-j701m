name: Compilar Kernel NetHunter J701M

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Descargar configuracion del repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar dependencias de compilacion Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses-dev lib32z1-dev liblz4-tool libncurses-dev libssl-dev libxml2-utils lzop rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: 3. Clonar Kernel Tree (Exynos 7870 Treble) y Toolchain GCC 4.9
        run: |
          git clone --depth=1 https://github.com/Astrako/android_kernel_samsung_exynos7870.git -b simple-kernel kernel_source || git clone --depth=1 https://github.com/Exynos7870/android_kernel_samsung_exynos7870.git kernel_source
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain

      - name: 4. Aplicar parche de inyeccion Wi-Fi (mac80211) y cargar defconfig
        run: |
          cp j7velte_nethunter_defconfig kernel_source/arch/arm64/configs/j7velte_nh_defconfig
          cd kernel_source
          sed -i 's/echo "+"/#echo "+"/g' scripts/setlocalversion || true
          sed -i 's/IEEE80211_TX_CTL_REQ_TX_STATUS/IEEE80211_TX_CTL_REQ_TX_STATUS | IEEE80211_TX_CTL_INJECTED/g' net/mac80211/tx.c || true

      - name: 5. Compilar el Kernel (arm64)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-android-
          cd kernel_source
          make O=out j7velte_nh_defconfig
          make O=out olddefconfig
          make O=out -j$(nproc --all)

      - name: 6. Empaquetar con AnyKernel3 para OrangeFox
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp kernel_source/out/arch/arm64/boot/Image AnyKernel3/
          printf "# AnyKernel3 Ramdisk Mod Script\nproperties() { '\nkernel.string=Kali NetHunter Kernel SM-J701M (Exynos 7870)\ndo.devicecheck=1\ndo.modules=0\ndo.systemless=1\ndo.cleanup=1\ndo.cleanuponabort=0\ndevice.name1=j7velte\ndevice.name2=j7veltedx\ndevice.name3=SM-J701M\ndevice.name4=j7xeltexx\n'; }\nblock=/dev/block/platform/13540000.dwmmc0/by-name/BOOT;\nis_slot_device=0;\nramdisk_compression=auto;\n. tools/ak3-core.sh;\ndump_boot;\nwrite_boot;\n" > AnyKernel3/anykernel.sh
          cd AnyKernel3
          rm -rf .git README.md
          zip -r9 ../NetHunter-J701M-Exynos7870-AnyKernel3.zip *

      - name: 7. Subir el ZIP listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-J701M-AnyKernel3-ZIP
          path: NetHunter-J701M-Exynos7870-AnyKernel3.zip
