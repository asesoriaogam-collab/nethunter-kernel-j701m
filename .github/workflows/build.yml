name: Compilar Kernel NetHunter J701M

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Descargar configuracion del repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar dependencias de compilacion Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 python-is-python2

      - name: 3. Clonar Kernel Tree (Exynos 7870 Treble) y Toolchain GCC 4.9
        run: |
          git clone --depth=1 https://github.com/Astrako/android_kernel_samsung_exynos7870.git -b simple-kernel kernel_source || git clone --depth=1 https://github.com/Exynos7870/android_kernel_samsung_exynos7870.git kernel_source
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain

      - name: 4. Aplicar parche de inyeccion Wi-Fi (mac80211) y cargar defconfig
        run: |
          cp j7velte_nethunter_defconfig kernel_source/arch/arm64/configs/j7velte_nh_defconfig
          cd kernel_source
          # Evitar que el sistema agregue el signo '+' al nombre del kernel para no romper modulos
          sed -i 's/echo "+"/#echo "+"/g' scripts/setlocalversion || true
          # Habilitar inyeccion en mac80211 si no esta parcheado
          sed -i 's/IEEE80211_TX_CTL_REQ_TX_STATUS/IEEE80211_TX_CTL_REQ_TX_STATUS | IEEE80211_TX_CTL_INJECTED/g' net/mac80211/tx.c || true

      - name: 5. Compilar el Kernel (arm64)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-android-
          cd kernel_source
          make O=out j7velte_nh_defconfig
          make O=out olddefconfig
          make O=out -j$(nproc --all)

      - name: 6. Empaquetar con AnyKernel3 para OrangeFox
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp kernel_source/out/arch/arm64/boot/Image AnyKernel3/
          cat << 'AK_EOF' > AnyKernel3/anykernel.sh
          # AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=Kali NetHunter Kernel SM-J701M (Exynos 7870)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=j7velte
          device.name2=j7veltedx
          device.name3=SM-J701M
          device.name4=j7xeltexx
          '; }
          block=/dev/block/platform/13540000.dwmmc0/by-name/BOOT;
          is_slot_device=0;
          ramdisk_compression=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          AK_EOF
          cd AnyKernel3
          rm -rf .git README.md
          zip -r9 ../NetHunter-J701M-Exynos7870-AnyKernel3.zip *

      - name: 7. Subir el ZIP listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-J701M-AnyKernel3-ZIP
          path: NetHunter-J701M-Exynos7870-AnyKernel3.zip
